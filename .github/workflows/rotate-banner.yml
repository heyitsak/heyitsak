name: Rotate Profile Banner

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows 1-click manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pick and Rotate Banner
        run: python rotate.py

      - name: Commit and Push New Banner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add banner.jpg
          if ! git diff --staged --quiet; then
            git commit -m "chore(banner): rotate profile banner [skip ci]"
            git push
          else
            echo "Banner already up to date."
          fi
